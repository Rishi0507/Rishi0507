<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 236" width="900" height="236" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,DejaVu Sans Mono,monospace">
<rect x="0.5" y="0.5" width="899" height="235" rx="12" fill="#080c11" stroke="#161f2b"/>
<text x="28" y="34" font-size="12" fill="#5c7080">996 settlements, one period. same data, two policies.</text>

<text x="28" y="74" font-size="13" fill="#7b93a8">trust the</text>
<text x="28" y="90" font-size="13" fill="#7b93a8">report</text>
<g>
<rect x="120" y="64" height="30" width="617.3" fill="#2b3a4b"></rect>
<rect x="737.3" y="64" height="30" width="29.8" fill="#e5534b"></rect>
<rect x="767.1" y="64" height="30" width="112.9" fill="#141c26" stroke="#1f2a37"></rect>
</g>
<text x="130" y="84" font-size="12" fill="#c9d8e5">848 posted</text>
<text x="740" y="112" font-size="12" fill="#e5534b">39 wrong, unseen</text>
<text x="872" y="84" font-size="12" fill="#5c7080" text-anchor="end">148 unpostable</text>

<text x="28" y="150" font-size="13" fill="#f0b429">manhattan</text>
<g>
<rect x="120" y="136" height="30" width="544.8" fill="#f0b429"></rect>
<rect x="664.8" y="136" height="30" width="215.2" fill="#141c26" stroke="#1f2a37"></rect>
</g>
<text x="130" y="156" font-size="12" fill="#080c11" font-weight="bold">714 posted, 0 wrong</text>
<text x="872" y="156" font-size="12" fill="#7b93a8" text-anchor="end">282 held</text>
<text x="872" y="184" font-size="12" fill="#5c7080" text-anchor="end">each with a cause, a remedy and a price</text>

<line x1="28" y1="204" x2="872" y2="204" stroke="#161f2b"/>
<text x="28" y="222" font-size="11" fill="#5c7080">posting the report's own mapping is faster and covers more. it is also wrong 39 times, and nothing says which 39.</text>
</svg>
